[package]
name = "maarco"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
chrono = "0.4.42"
clap = { version = "4.5.48", features = ["derive"] }
crossterm = "0.29.0"
csv = "1.3.1"

nmea = { version = "0.7.0", features = ["default", "serde"] }
serde = "1.0.228"
serialport = { version = "4.7.3", default-features = false }