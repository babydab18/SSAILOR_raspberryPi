[project]
name = "ssailor-gps-tools"
version = "0.1.0"
description = "GPS diagnostics, plotting, and optional desktop GPS UI for SSAILOR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyserial>=3.5",
    "pynmeagps>=1.0.53",
    "pyrtcm>=1.1.9",
]

[project.optional-dependencies]
desktop = ["pygpsclient>=1.5.14"]
